# Local full-stack dev environment.
# Run: docker compose up --build
# Visit: http://localhost:5173

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/confer
      CLIENT_URL: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
      JWT_SECRET: dev-only-change-in-production
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      EMAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      UPLOAD_ROOT: /app/uploads
    volumes:
      - confer-uploads:/app/uploads

volumes:
  mongo-data:
  confer-uploads:
