<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13161c" />

    <!-- Primary SEO -->
    <title>Confer — Premium expert booking marketplace</title>
    <meta name="description" content="Confer is India's premium marketplace for booking 1:1 sessions with vetted mentors, designers, engineers, founders, and operators. Real-time availability, verified reviews, INR pricing." />
    <meta name="keywords" content="expert mentorship, career mentor, startup advisor, India, design mentor, software engineer mentor, AI consultant, 1:1 sessions, Confer" />
    <meta name="author" content="Confer" />
    <link rel="canonical" href="https://confer.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Confer — Premium expert booking marketplace" />
    <meta property="og:description" content="Book real conversations with India's top mentors, designers, engineers, and founders. Pick a service, lock in a slot, walk away with answers." />
    <meta property="og:site_name" content="Confer" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Confer — Premium expert booking marketplace" />
    <meta name="twitter:description" content="Book real conversations with India's top mentors, designers, engineers, and founders." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Razorpay checkout (no-op until invoked; safe in sandbox) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <!-- Theme bootstrap (prevents FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
